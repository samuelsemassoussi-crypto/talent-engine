<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruiter login — Talent Engine</title><link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body><main class="auth-wrap"><div class="card auth-card">
<a class="brand" href="index.html"><img src="assets/logo.svg" alt="">Talent Engine</a>
<h1>Recruiter login</h1><p class="muted">Sign in to access the recruiter dashboard.</p>
<form id="auth-form" novalidate><div id="msg" role="alert" hidden></div>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary" type="submit" id="submit">Sign in</button></form>
<p class="auth-alt">No account yet? <a href="register.html">Register with an access code</a></p></div></main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
